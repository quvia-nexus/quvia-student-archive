<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUVIA STUDENT ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2E2C28;
    --paper:#FBF8F0;
    --stone:#F2EEE1;
    --line:#E4DFCE;
    --signal:#5F8567;
    --signal-bright:#4C6F53;
    --signal-tint:#E3ECE3;
    --sage:#5F8567;
    --sage-tint:#E3ECE3;
    --cream-card:#FDF9EC;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--paper);
    background-image:radial-gradient(var(--line) 1.1px, transparent 1.1px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Pretendard', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px;position:relative;}
  .mono{font-family:'Pretendard', sans-serif;}

  /* ================= NAV ================= */
  :root{
    --dark-bg:#15130F;
    --dark-line:#2E2B24;
    --gold:#D9A441;
    --gold-soft:#3A2F1C;
  }
  nav.topnav{
    padding:16px 0;
    background:var(--dark-bg);
  }
  .topnav-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;background:var(--gold);color:#241F1A;
    display:flex;align-items:center;justify-content:center;
    font-family:'Pretendard', sans-serif;font-weight:800;font-size:18px;flex:none;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.25;}
  .brand-text b{font-family:'Pretendard', sans-serif;font-weight:800;font-size:15px;letter-spacing:.01em;color:#fff;}
  .brand-text em{font-style:normal;font-size:11px;color:#9A9384;letter-spacing:.06em;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .status{
    font-family:'Pretendard', sans-serif;font-size:11px;color:#9A9384;letter-spacing:.02em;
    display:flex;align-items:center;gap:6px;
  }
  .status i{width:6px;height:6px;border-radius:50%;background:#6FA88A;display:inline-block;flex:none;}
  .ghost-btn{
    font-family:'Pretendard', sans-serif;font-size:12.5px;font-weight:600;color:#fff;
    border:1px solid rgba(255,255,255,.35);padding:7px 16px;border-radius:20px;text-decoration:none;
  }
  .ghost-btn:hover{background:rgba(255,255,255,.08);}

  /* ================= HERO (home) ================= */
  header.hero{
    padding:40px 0 48px;background:var(--dark-bg);
    width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;
  }
  .hero-grid{display:flex;gap:40px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;}
  .hero-text{flex:1;min-width:280px;}
  .eyebrow{
    font-family:'Pretendard', sans-serif;font-weight:700;font-size:14px;letter-spacing:.18em;color:var(--gold);
    margin-bottom:26px;display:flex;align-items:center;gap:10px;
  }
  .eyebrow::before{content:"";display:inline-block;width:26px;height:1px;background:var(--gold);}
  h1.hero-title{
    font-family:'Pretendard', sans-serif;font-weight:900;font-size:clamp(38px,5.4vw,60px);
    line-height:1.22;margin:0 0 26px;letter-spacing:-0.01em;color:#fff;
  }
  .hero-highlight{color:var(--gold);border-bottom:8px solid var(--gold-soft);padding-bottom:3px;}
  .hero-desc{max-width:none;font-size:18px;line-height:1.8;color:#B7B0A0;margin:0;white-space:normal;}

  .hero-art{width:260px;flex:none;}
  @media (max-width:760px){ .hero-art{display:none;} }

  .hero-art-card{
    background:#1D1A15;border:1px solid var(--dark-line);border-radius:14px;padding:16px;
  }
  .hero-art-label{
    font-family:'Pretendard', sans-serif;font-size:10px;letter-spacing:.14em;color:#9A9384;margin-bottom:6px;
  }
  .hero-art svg{width:100%;height:auto;display:block;margin-bottom:8px;}
  .growth-legend{list-style:none;margin:0;padding:0;border-top:1px solid var(--dark-line);}
  .growth-legend li{
    display:flex;align-items:center;gap:7px;padding:6px 0;
    font-family:'Pretendard', sans-serif;font-size:11px;color:#D8D3C6;
    border-bottom:1px solid var(--dark-line);
  }
  .growth-legend li:last-child{border-bottom:none;}
  .growth-legend .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .growth-legend .phrase{flex:1;}
  .growth-legend .level-name{font-size:9.5px;letter-spacing:.08em;color:#8a8578;}


  /* ================= CONTROLS ================= */
  .controls{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;padding:26px 0;
    border-bottom:1px solid var(--line);
  }
  .search-box{
    font-family:'Pretendard', sans-serif;font-size:14px;padding:11px 16px;border:1px solid var(--line);
    border-radius:14px;background:var(--white);width:260px;outline:none;
  }
  .search-box:focus{border-color:var(--ink);}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-chip{
    font-family:'Pretendard', sans-serif;font-size:12px;letter-spacing:.03em;padding:8px 14px;
    border:1px solid var(--line);border-radius:14px;background:var(--white);cursor:pointer;color:var(--ink);
  }
  .filter-chip.active{background:var(--sage);color:#fff;border-color:var(--sage);}
  .result-count{font-family:'Pretendard', sans-serif;font-size:12px;color:#8a8578;}

  /* ================= STUDENT INDEX (home grid) ================= */
  .index-list{padding:8px 0 80px;display:grid;grid-template-columns:repeat(4, 1fr);gap:16px;}
  @media (max-width:900px){ .index-list{grid-template-columns:repeat(2, 1fr);} }
  @media (max-width:520px){ .index-list{grid-template-columns:1fr;} }
  .index-row{
    display:flex;flex-direction:column;align-items:flex-start;gap:10px;
    padding:22px;border:1px solid var(--line);border-radius:16px;cursor:pointer;
    background:var(--cream-card);text-align:left;width:100%;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .index-row:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(46,44,40,.22);background:var(--cream-card);}
  .index-no{font-family:'Pretendard', sans-serif;font-size:11px;color:#8a8578;}
  .index-main{width:100%;}
  .index-main h3{font-family:'Pretendard', sans-serif;font-weight:800;font-size:18px;margin:0 0 6px;}
  .index-meta-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .index-counts{
    display:flex;gap:16px;font-family:'Pretendard', sans-serif;font-size:11px;color:#4A473F;
    border-top:1px solid var(--line);padding-top:12px;width:100%;
  }
  .index-counts b{color:var(--ink);font-weight:600;display:block;font-size:15px;font-family:'Pretendard', sans-serif;}
  .avatar{
    width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Pretendard', sans-serif;font-weight:800;font-size:18px;color:#fff;flex:none;
  }
  .dream-oval{
    display:inline-flex;align-items:center;justify-content:center;text-align:center;
    padding:12px 18px;border-radius:999px;background:var(--sage);color:#fff;
    font-size:12.5px;font-weight:600;line-height:1.35;min-height:44px;width:100%;
  }
  .dream-oval-lg{
    display:inline-flex;align-items:center;justify-content:center;text-align:center;
    padding:16px 26px;border-radius:999px;background:var(--sage);color:#fff;
    font-size:14px;font-weight:600;line-height:1.4;min-height:60px;max-width:280px;
  }
  .index-main h3{font-family:'Pretendard', sans-serif;font-weight:800;font-size:19px;margin:0 0 4px;}
  .index-meta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .grade-txt{font-size:13px;color:#4A473F;}
  .level-badge{
    font-family:'Pretendard', sans-serif;font-size:10.5px;letter-spacing:.04em;color:var(--signal);
    background:var(--signal-tint);padding:2px 8px;border-radius:14px;
  }
  .field-tag{
    font-family:'Pretendard', sans-serif;font-size:10.5px;color:#4A473F;background:var(--stone);
    padding:2px 8px;border-radius:14px;
  }
  .index-counts{text-align:right;font-family:'Pretendard', sans-serif;font-size:11.5px;color:#4A473F;line-height:1.7;white-space:nowrap;}
  .index-counts b{color:var(--ink);font-weight:600;}

  /* ================= STUDENT DETAIL ================= */
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;font-family:'Pretendard', sans-serif;font-size:12.5px;
    color:var(--signal);background:none;border:0;cursor:pointer;padding:0;margin-bottom:22px;
  }
  .profile-head{padding:40px 0 36px;border-bottom:1px solid var(--line);display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;}
  .profile-avatar-col{display:flex;flex-direction:column;align-items:center;gap:14px;flex:none;}
  .profile-photo{
    width:120px;height:120px;border-radius:50%;object-fit:cover;border:1px solid var(--line);
  }
  .profile-photo-default{display:flex;overflow:hidden;}
  .profile-photo-default svg{width:100%;height:100%;}
  .photo-preset-grid{display:grid;grid-template-columns:repeat(5, 1fr);gap:6px;}
  .photo-preset-btn{
    padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
    background:#fff;aspect-ratio:1;
  }
  .photo-preset-btn img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-preset-btn.active{border-color:var(--signal);}
  .avatar-lg{
    width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Pretendard', sans-serif;font-weight:900;font-size:34px;color:#fff;flex:none;
  }
  .profile-info h1{font-family:'Pretendard', sans-serif;font-weight:900;font-size:34px;margin:0 0 8px;}
  .profile-sub{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .profile-intro{max-width:480px;font-size:14.5px;line-height:1.75;color:#4A473F;margin:0 0 16px;}
  .profile-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .self-badge{
    display:inline-block;font-family:'Pretendard', sans-serif;font-size:12px;color:var(--signal);
    background:var(--signal-tint);padding:6px 12px;border-radius:20px;margin:10px 0 16px;
  }
  .self-edit-link{
    background:none;border:0;font-size:10px;color:var(--signal);cursor:pointer;padding:0;margin-left:4px;
    text-decoration:underline;
  }
  .profile-counts{display:flex;gap:26px;flex-wrap:wrap;}
  .profile-counts div{font-family:'Pretendard', sans-serif;font-size:12px;color:#8a8578;}
  .profile-counts b{display:block;font-family:'Pretendard', sans-serif;font-size:22px;color:var(--ink);font-weight:800;}

  .ledger-label{
    font-family:'Pretendard', sans-serif;font-size:12px;letter-spacing:.1em;color:#8a8578;
    text-transform:uppercase;padding:36px 0 4px;
  }

  /* growth ledger — signature element */
  .ledger{position:relative;padding-left:64px;padding-bottom:60px;}
  .ledger::before{
    content:"";position:absolute;left:29px;top:6px;bottom:6px;width:1px;background:var(--line);
  }
  .ledger-year{position:relative;margin-bottom:6px;}
  .ledger-year-label{
    position:absolute;left:-64px;top:-2px;width:64px;text-align:right;padding-right:20px;
    font-family:'Pretendard', sans-serif;font-weight:900;font-size:20px;color:var(--ink);
  }
  .ledger-year-label::after{
    content:"";position:absolute;right:-4.5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--signal);
  }
  .ledger-projects{padding:6px 0 26px;display:grid;grid-template-columns:repeat(4, 1fr);gap:14px;}
  @media (max-width:900px){ .ledger-projects{grid-template-columns:repeat(2, 1fr);} }
  @media (max-width:520px){ .ledger-projects{grid-template-columns:1fr;} }
  .proj-card{
    display:flex;flex-direction:column;background:#F1ECFB;border:1px solid #DCD2F0;
    border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
  }
  .proj-card.program{background:#F1ECFB;border-color:#DCD2F0;}
  .proj-card.presentation{background:#E9F5EE;border-color:#CBE7D6;}
  .proj-card.report{background:#FDF3E2;border-color:#F0DDA9;}
  .proj-card:hover{transform:translateY(-3px);box-shadow:0 10px 20px -12px rgba(60,50,30,.28);}
  .proj-card-thumb{
    width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#E4DAF5;
  }
  .proj-card-thumb-fallback{
    width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
    font-size:28px;background:#E4DAF5;color:#6B5FA8;
  }
  .proj-card.presentation .proj-card-thumb, .proj-card.presentation .proj-card-thumb-fallback{background:#D7EEDF;color:#3F8F5E;}
  .proj-card.report .proj-card-thumb, .proj-card.report .proj-card-thumb-fallback{background:#F7E7C4;color:#B5791C;}
  .proj-card-body{padding:14px 16px 16px;}
  .proj-type-icon{display:none;}
  .proj-card h4{font-family:'Pretendard', sans-serif;font-weight:800;font-size:15px;margin:0 0 6px;color:#3A2E5C;}
  .proj-card.presentation h4{color:#245C3B;}
  .proj-card.report h4{color:#7A5710;}
  .proj-card p{font-size:12.5px;color:#5B4E80;margin:0 0 10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .proj-card.presentation p{color:#3F704F;}
  .proj-card.report p{color:#8A6A2E;}
  .proj-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .type-tag{font-family:'Pretendard', sans-serif;font-size:10px;letter-spacing:.04em;padding:2px 7px;border-radius:14px;}
  .type-tag.program{background:#fff;color:#6B5FA8;}
  .type-tag.report{background:#fff;color:#B5791C;}
  .type-tag.presentation{background:#fff;color:#3F8F5E;}
  .type-tag.aiProject{background:var(--signal-tint);color:var(--signal);}
  .date-tag{font-family:'Pretendard', sans-serif;font-size:10px;color:#8a8578;}

  /* ================= PROJECT DETAIL ================= */
  .proj-hero{
    padding:36px 0 20px;
    border-bottom:1px solid var(--line);
  }
  .side-thumb-wrap{
    width:100%;aspect-ratio:16/9;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:16px;
  }
  .side-thumb{width:100%;height:100%;object-fit:cover;display:block;}
  h1.proj-title{font-family:'Pretendard', sans-serif;font-weight:900;font-size:clamp(26px,4vw,40px);margin:0 0 10px;line-height:1.12;}
  .proj-top-meta{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}

  .proj-body{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:30px 0 70px;align-items:stretch;}
  @media (max-width:760px){ .proj-body{grid-template-columns:1fr;} }

  .proj-left{display:flex;flex-direction:column;gap:16px;height:100%;}
  .proj-section{flex:1 1 0;display:flex;flex-direction:column;min-height:0;}
  .proj-section h3{
    font-family:'Pretendard', sans-serif;font-size:12px;letter-spacing:.08em;color:#8a8578;
    text-transform:uppercase;margin:0 0 8px;flex:none;
  }
  .proj-section p{
    font-size:14.5px;line-height:1.8;color:#2b291f;margin:0;white-space:pre-line;
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    flex:1;overflow-y:auto;min-height:0;
  }

  .side-box{display:flex;flex-direction:column;height:100%;}
  .side-label{font-family:'Pretendard', sans-serif;font-size:11px;letter-spacing:.08em;color:#8a8578;text-transform:uppercase;margin-bottom:10px;}
  .side-two-col{display:flex;gap:12px;margin-bottom:16px;}
  .side-col-box{
    flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;
  }
  .side-actions-box{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:auto;
  }
  .chip-wrap{display:flex;gap:6px;flex-wrap:wrap;}
  .chip-plain{
    font-family:'Pretendard', sans-serif;font-size:11px;background:var(--stone);color:#4A473F;
    padding:4px 9px;border-radius:14px;
  }
  .action-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    font-family:'Pretendard', sans-serif;font-size:13px;font-weight:600;padding:13px 16px;border-radius:14px;
    border:1px solid var(--signal);background:var(--signal);color:#fff;cursor:pointer;margin-bottom:10px;
  }
  .action-btn:last-child{margin-bottom:0;}
  .action-btn.outline{background:none;color:var(--ink);border-color:var(--line);}
  .action-btn:hover{background:var(--signal-bright);border-color:var(--signal-bright);color:#fff;}
  .demo-note{font-family:'Pretendard', sans-serif;font-size:11px;color:#8a8578;line-height:1.6;margin-top:8px;}

  .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .media-grid div{
    height:110px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.8);font-size:22px;
  }

  footer.site-footer{border-top:1px solid var(--line);padding:26px 0 40px;font-family:'Pretendard', sans-serif;font-size:11.5px;color:#8a8578;}
  .footer-inner{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}
  .footer-mark{font-family:'Pretendard', sans-serif;font-weight:800;font-size:13px;color:var(--ink);margin:0 0 4px;}
  .footer-note{margin:0;font-size:11.5px;color:#8a8578;}

  /* ================= ADMIN ================= */
  .admin-wrap{padding:44px 0 70px;max-width:640px;}
  .admin-login{max-width:360px;padding-top:80px;}
  .admin-title{font-family:'Pretendard', sans-serif;font-weight:900;font-size:28px;margin:0 0 24px;}
  .admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;}
  .admin-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#4A473F;margin-bottom:22px;}
  .admin-stats b{color:var(--ink);font-weight:700;font-size:15px;font-family:'Pretendard',sans-serif;}
  .admin-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .admin-tab{
    font-family:'Pretendard', sans-serif;font-size:12.5px;padding:10px 4px;margin-right:18px;
    background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:#8a8578;
  }
  .admin-tab.active{color:var(--ink);border-bottom-color:var(--signal);}
  .edit-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .edit-row input[type="text"], .edit-row input[type="email"], .edit-row input[type="password"], .edit-row input[type="date"]{
    font-family:'Pretendard', sans-serif;font-size:13.5px;padding:9px 10px;border:1px solid var(--line);
    border-radius:14px;flex:1;min-width:140px;outline:none;
  }
  .edit-row input:focus{border-color:var(--signal);}
  .grade-btn-group{display:flex;gap:6px;flex-wrap:wrap;}
  .admin-form select{
    font-family:'Pretendard', sans-serif;font-size:13.5px;padding:9px 10px;border:1px solid var(--line);
    border-radius:14px;background:var(--white);flex:1;min-width:140px;
  }
  .admin-msg{margin-top:10px;color:#8a8578;min-height:16px;}
  .admin-error{margin-top:10px;color:#B5391F;}
  .admin-list-row{
    display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid var(--line);font-size:13.5px;
  }
  .del-btn{background:none;border:1px solid var(--line);border-radius:14px;padding:5px 10px;cursor:pointer;color:#B5391F;font-size:11px;}
</style>
</head>
<body>

<nav class="topnav">
  <div class="wrap topnav-inner">
    <a href="#/" class="brand" aria-label="큐비아 스튜던트 아카이브 홈으로">
      <span class="brand-mark">Q</span>
      <span class="brand-text">
        <b>QUVIA</b>
        <em>Student Archive</em>
      </span>
    </a>
    <div class="topbar-right">
      <span class="status"><i></i><span id="dataStatus">CONNECTING…</span></span>
      <a href="#/admin" class="ghost-btn">관리자</a>
    </div>
  </div>
</nav>

<div class="wrap" id="app"></div>
<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <p class="footer-mark">QUVIA STUDENT ARCHIVE</p>

/* 큐비아랩 레벨 문자열("LV.3 Probe") → 아카이브 레벨명("Probe") 변환 */
function normalizeLevel(raw){
  if(!raw) return 'Sense';
  const m = String(raw).match(/Sense|Spark|Probe|Build|Master/i);
  return m ? m[0][0].toUpperCase() + m[0].slice(1).toLowerCase() : 'Sense';
}

/* ================================================================
   DATA LOADING
   - 학생 명부/꿈: 큐비아랩 홈페이지가 쓰는 quvia/students 문서를 그대로 읽음 (읽기 전용)
   - 작품: 아카이브 자체 projects 컬렉션 (studentId = 큐비아랩 학생 "아이디"로 연결)
   ================================================================ */
async function loadData(){
  const statusEl = document.getElementById('dataStatus');
  if(!isConfigured){
    STUDENTS = MOCK_STUDENTS; PROJECTS = MOCK_PROJECTS;
    statusEl.textContent = 'FIREBASE 미설정 · 목업 데이터 표시중';
    return;
  }
  try{
    const [rosterSnap, projectsSnap, profilesSnap] = await Promise.all([
      getDoc(doc(db,'quvia','students')),
      getDocs(query(collection(db,'projects'), orderBy('date','desc'))),
      getDocs(collection(db,'studentProfiles'))
    ]);
    const roster = rosterSnap.exists() ? (rosterSnap.data().value || []) : [];
    const liveProjects = projectsSnap.docs.map(d => ({ id:d.id, ...d.data() }));
    const profileMap = {};
    profilesSnap.docs.forEach(d => { profileMap[d.id] = d.data().profileImageUrl || ''; });

    if(roster.length === 0){
      STUDENTS = MOCK_STUDENTS; PROJECTS = MOCK_PROJECTS;
      statusEl.textContent = '큐비아랩 학생 명부 없음(목업 표시중) · 관리자 "Firebase 전체 업로드" 확인 필요';
    } else {
      STUDENTS = roster.map(r => ({
        id: r.id,                       // 큐비아랩 학생 아이디 = 아카이브 연결 키
        name: r.name || '(이름 미입력)',
        grade: r.grade || '',
        level: normalizeLevel(r.level),
        dream: r.dream || '',
        quviaId: r.id,
        profileImageUrl: profileMap[r.id] || '',
      }));
      PROJECTS = liveProjects;
      statusEl.textContent = `큐비아랩 연동됨 · 학생 ${STUDENTS.length}명 · 최근 업로드 기준`;
    }
  }catch(err){
    console.error(err);
    STUDENTS = MOCK_STUDENTS; PROJECTS = MOCK_PROJECTS;
    statusEl.textContent = 'FIREBASE 연결 실패 · 목업 데이터 표시중 (콘솔 확인)';
  }
}

const TYPE_META = {
  program:      { icon:'💻', label:'프로그램' },
  report:       { icon:'🔬', label:'보고서' },
  presentation: { icon:'🎤', label:'발표자료' },
  aiProject:    { icon:'✨', label:'AI프로젝트' },
};

function projectsOf(studentId){ return PROJECTS.filter(p => p.studentId === studentId); }
function counts(studentId){
  const ps = projectsOf(studentId);
  return {
    total: ps.length,
    program: ps.filter(p=>p.type==='program').length,
    report: ps.filter(p=>p.type==='report').length,
    presentation: ps.filter(p=>p.type==='presentation').length,
    aiProject: ps.filter(p=>p.type==='aiProject').length,
  };
}

  { level:'Sense',  color:'#D9A441', phrase:'관찰하고 질문한다',       pos:[24,128] },
  { level:'Spark',  color:'#8B7FC9', phrase:'아이디어에 불을 붙인다',   pos:[78,98]  },

function growthPathArt(){
  const pathD = GROWTH_LEVELS.map((n,i) => (i===0?'M':'L') + n.pos[0] + ',' + n.pos[1]).join(' ');
  const nodes = GROWTH_LEVELS.map(n => `
    <circle cx="${n.pos[0]}" cy="${n.pos[1]}" r="7" fill="${n.color}"/>
  `).join('');
  const legend = GROWTH_LEVELS.map(n => `
    <li>
      <span class="dot" style="background:${n.color}"></span>
      <span class="phrase">${esc(n.phrase)}</span>
      <span class="level-name mono">${n.level.toUpperCase()}</span>
    </li>
  `).join('');

  return `
    <div class="hero-art-card">
      <div class="hero-art-label mono">GROWTH PATH</div>
      <svg viewBox="0 0 254 145" xmlns="http://www.w3.org/2000/svg">
        <path d="${pathD}" stroke="#5A4B2A" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="1 9"/>
        ${nodes}
      </svg>
      <ul class="growth-legend">${legend}</ul>
    </div>`;
}

function renderStudent(id){
  const s = STUDENTS.find(x => x.id === id);
  if(!s){ app.innerHTML = `<div class="demo-note" style="padding:60px 0;">학생을 찾을 수 없습니다.</div>`; return; }
  const c = counts(s.id);
  const ps = projectsOf(s.id);

  // group by year, descending
  const byYear = {};
  ps.forEach(p => { const y = p.date.slice(0,4); (byYear[y] = byYear[y]||[]).push(p); });
  const years = Object.keys(byYear).sort((a,b)=>b-a);
  years.forEach(y => byYear[y].sort((a,b)=> b.date.localeCompare(a.date)));

  const isSelf = SELF_MODE_SID && s.id === SELF_MODE_SID;
  const canEditPhoto = isSelf || !!currentUser;

  app.innerHTML = `
    ${isSelf ? '' : `<button class="back-btn" onclick="location.hash='#/'">← 학생 목록으로</button>`}

    <div class="profile-head">
      <div class="profile-avatar-col">
        <span class="dream-oval-lg">${esc(s.dream || '꿈을 입력해주세요')}</span>
        <img class="profile-photo" id="profilePhotoImg" src="${esc(s.profileImageUrl || defaultAvatarUrl(s.level))}" alt="${esc(s.name)}">
        ${canEditPhoto ? `<button class="mono self-edit-link" id="photoEditBtn" style="font-size:11.5px;">✏ 사진 변경</button>` : ''}
        <div id="photoPicker"></div>
      </div>
      <div class="profile-info">
        <h1>${esc(s.name)}</h1>
        <div class="profile-sub">
          <span class="grade-txt">${esc(s.grade)}</span>
          <span class="level-badge mono">LEVEL · ${esc(s.level)}</span>
        </div>
        ${isSelf ? `<div class="self-badge mono">🔓 본인 편집 모드 — 내 작품을 직접 등록·수정할 수 있어요</div>` : ''}
        <div class="profile-counts">
          <div>PROJECTS<b>${c.total}</b></div>
          <div>PROGRAMS<b>${c.program}</b></div>
          <div>REPORTS<b>${c.report}</b></div>
          <div>PRESENTATIONS<b>${c.presentation}</b></div>
        </div>
      </div>
    </div>

    ${isSelf ? `
    <button class="action-btn" id="selfAddBtn" style="width:auto;padding:11px 20px;margin-top:20px;">+ 내 작품 추가</button>
    <div id="selfProjectForm"></div>
    ` : ''}

    <div class="ledger-label mono">GROWTH LEDGER — 성장 기록</div>
    <div class="ledger" id="ledger"></div>
  `;

  if(canEditPhoto){
    document.getElementById('photoEditBtn').addEventListener('click', () => {
      renderPhotoPicker(document.getElementById('photoPicker'), s);
    });
  }

  if(isSelf){
    document.getElementById('selfAddBtn').addEventListener('click', () => {
      renderSelfProjectForm(document.getElementById('selfProjectForm'), s, null);
    });
  }

  renderLedger(s, byYear, years, isSelf);
}

function renderLedger(s, byYear, years, isSelf){
  const ledger = document.getElementById('ledger');
  if(years.length === 0){
    ledger.innerHTML = `<div class="demo-note">아직 등록된 작품이 없습니다.</div>`;
  } else {
    ledger.innerHTML = years.map(y => `
      <div class="ledger-year">
        <span class="ledger-year-label mono">${y}</span>
        <div class="ledger-projects">
          ${byYear[y].map(p => {
            const meta = TYPE_META[p.type];
            return `
            <div class="proj-card ${p.type}" data-pid="${p.id}">
              ${p.thumbnailUrl
                ? `<img class="proj-card-thumb" src="${esc(p.thumbnailUrl)}" alt="${esc(p.title)}">`
                : `<div class="proj-card-thumb-fallback">${meta.icon}</div>`}
              <div class="proj-card-body">
                <h4>${esc(p.title)}</h4>
                <p>${esc(p.description)}</p>
                <div class="proj-meta">
                  <span class="type-tag ${p.type} mono">${meta.label}</span>
                  <span class="date-tag mono">${esc(p.date)}</span>
                  ${isSelf ? `
                    <button class="mono self-edit-link" data-action="edit" data-pid="${p.id}">수정</button>
                    <button class="mono self-edit-link" data-action="delete" data-pid="${p.id}" style="color:#B5391F;">삭제</button>
                  ` : ''}
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `).join('');

    ledger.querySelectorAll('.proj-card').forEach(el => {
      el.addEventListener('click', (e) => {
        if(e.target.closest('.self-edit-link')) return;
        location.hash = `#/student/${s.id}/project/${el.dataset.pid}`;
      });
    });

    if(isSelf){
      ledger.querySelectorAll('.self-edit-link[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const p = PROJECTS.find(x => x.id === btn.dataset.pid);
          renderSelfProjectForm(document.getElementById('selfProjectForm'), s, p);
          document.getElementById('selfProjectForm').scrollIntoView({behavior:'smooth'});
        });
      });
      ledger.querySelectorAll('.self-edit-link[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if(!confirm('이 작품을 삭제할까요? 되돌릴 수 없습니다.')) return;
          await deleteDoc(doc(db,'projects', btn.dataset.pid));
          await loadData();
          renderStudent(s.id);
        });
      });
    }
  }
}

function renderPhotoPicker(container, student){
  if(container.innerHTML){ container.innerHTML=''; return; } // 토글: 다시 누르면 닫힘

  container.innerHTML = `
    <div class="admin-form" style="margin-top:14px;text-align:left;width:260px;">
      <div class="side-label mono" style="margin-bottom:10px;">학원 캐릭터 중 선택</div>
      <div class="photo-preset-grid" id="photoPresetGrid">
        ${MASCOT_PRESETS.map(m => `
          <button type="button" class="photo-preset-btn" data-url="${m.url}" title="${esc(m.name)}">
            <img src="${m.url}" alt="${esc(m.name)}">
          </button>
        `).join('')}
      </div>
      <div class="mono" style="font-size:11px;color:#8a8578;margin:14px 0 8px;">— 또는 직접 업로드 —</div>
      <div class="edit-row"><input type="file" id="photoUploadInput" accept="image/*"></div>
      <div style="display:flex;gap:8px;">
        <button class="action-btn" id="photoSaveBtn" style="width:auto;padding:9px 16px;">저장</button>
        <button class="action-btn outline" id="photoCancelBtn" style="width:auto;padding:9px 16px;">취소</button>
      </div>
      <div class="admin-msg mono" id="photoMsg"></div>
    </div>`;

  let selectedPresetUrl = null;

  container.querySelectorAll('.photo-preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedPresetUrl = btn.dataset.url;
      container.querySelectorAll('.photo-preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('photoUploadInput').value = '';
    });
  });

  document.getElementById('photoCancelBtn').addEventListener('click', () => { container.innerHTML = ''; });

  document.getElementById('photoSaveBtn').addEventListener('click', async () => {
    const msg = document.getElementById('photoMsg');
    const fileInput = document.getElementById('photoUploadInput');
    msg.textContent = '저장 중…';
    try{
      let url = selectedPresetUrl;
      if(fileInput.files[0]){
        url = await uploadFileFromInput(fileInput, 'profiles');
      }
      if(!url){ msg.textContent = '캐릭터를 선택하거나 사진을 올려주세요.'; return; }
      await setDoc(doc(db,'studentProfiles', student.id), { profileImageUrl: url }, { merge:true });
      msg.textContent = '저장 완료.';
      await loadData();
      renderStudent(student.id);
    }catch(err){
      console.error(err);
      msg.textContent = '저장 실패: ' + err.message;
    }
  });
}

      <div class="proj-top-meta">
        <span class="type-tag ${p.type} mono">${meta.label}</span>
        <span class="date-tag mono">${esc(p.date)}</span>
        <span class="grade-txt">by ${esc(s.name)}</span>
      </div>
    </div>

    <div class="proj-body">
      <div class="proj-left">
        <div class="proj-section">
          <h3>프로젝트 설명</h3>
          <p>${esc(p.description)}</p>
        </div>
        <div class="proj-section">
          <h3>탐구 · 제작 과정</h3>
          <p>${esc(p.process)}</p>
        </div>
        <div class="proj-section">
          <h3>배운 점</h3>
          <p>${esc(p.learnings)}</p>
        </div>
      </div>

      <div class="side-box">
        <div class="side-thumb-wrap">
          ${p.thumbnailUrl
            ? `<img class="side-thumb" src="${p.thumbnailUrl}" alt="${esc(p.title)}">`
            : `<div class="side-thumb" style="background:${levelColor(s.level)};display:flex;align-items:center;justify-content:center;font-size:40px;color:rgba(255,255,255,.85);">${meta.icon}</div>`}
        </div>

        <div class="side-col-box" style="margin-bottom:16px;">
          <div class="side-label mono">사용 기술</div>
          <div class="chip-wrap">${p.techStack && p.techStack.length ? p.techStack.map(t=>`<span class="chip-plain mono">${esc(t)}</span>`).join('') : '<span class="demo-note" style="margin:0;">없음</span>'}</div>
        </div>

        <div class="side-actions-box">
          ${actionsHtml}
        </div>
      </div>
    </div>
  `;
}

/* ================================================================
   ADMIN
   ================================================================ */
let currentUser = null;
if(isConfigured){
  onAuthStateChanged(auth, (user) => {
    const prevUid = currentUser ? currentUser.uid : null;

    if(user && ADMIN_EMAILS.length && !ADMIN_EMAILS.includes(user.email)){
      signOut(auth);
      currentUser = null;
      if(location.hash.startsWith('#/admin')){
        renderAdminLogin();
        const err = document.getElementById('loginError');
        if(err) err.textContent = `허용되지 않은 계정입니다 (${user.email}). 관리자에게 문의하세요.`;
      }
      return;
    }

    currentUser = user;
    const newUid = currentUser ? currentUser.uid : null;
    // 실제로 로그인/로그아웃 상태가 바뀐 경우에만 다시 그린다.
    // (그렇지 않으면 Firebase의 초기 상태 확인 콜백이 뒤늦게 도착해서
    //  사용자가 입력 중이던 이메일/비밀번호를 지워버리는 문제가 생김)
    if(prevUid !== newUid && location.hash.startsWith('#/admin')) renderAdmin();
  });
}

function renderAdmin(){
  if(!isConfigured){
    app.innerHTML = `
      <div class="admin-wrap">
        <h1 class="admin-title">관리자</h1>
        <div class="demo-note" style="padding:20px 0;">Firebase가 아직 설정되지 않았습니다. 파일 상단 FIREBASE_CONFIG 값을 채워야 관리자 기능을 쓸 수 있습니다.</div>
      </div>`;
    return;
  }
  if(!currentUser){ renderAdminLogin(); return; }
  renderAdminPanel();
}

function renderAdminLogin(){
  app.innerHTML = `
    <div class="admin-wrap admin-login">
      <h1 class="admin-title">관리자 로그인</h1>
      <button class="action-btn outline" id="googleLoginBtn" style="width:100%;margin-bottom:18px;">🔐 Google 계정으로 로그인</button>
      <div class="mono" style="font-size:11px;color:#8a8578;text-align:center;margin-bottom:18px;">— 또는 —</div>
      <div class="edit-row"><input type="email" id="adminEmail" placeholder="이메일"></div>
      <div class="edit-row"><input type="password" id="adminPw" placeholder="비밀번호"></div>
      <button class="action-btn" id="loginBtn" style="width:auto;padding:12px 22px;">이메일로 로그인</button>
      <div class="admin-error mono" id="loginError"></div>
    </div>`;

  document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try{
      await signInWithPopup(auth, new GoogleAuthProvider());
    }catch(err){
      errEl.textContent = 'Google 로그인 실패: ' + err.message;
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('adminEmail').value.trim();
    const pw = document.getElementById('adminPw').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try{
      await signInWithEmailAndPassword(auth, email, pw);
    }catch(err){
      errEl.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인하세요.';
    }
  });
}

function renderAdminPanel(){
  const years = PROJECTS.map(p => parseInt((p.date||'').slice(0,4),10)).filter(Boolean);
  const yearRange = years.length ? `${Math.min(...years)}–${Math.max(...years)}` : '–';

  app.innerHTML = `
    <div class="admin-wrap">
      <div class="admin-head">
        <h1 class="admin-title">관리자</h1>
        <div>
          <span class="mono" style="font-size:12px;color:#8a8578;margin-right:12px;">${esc(currentUser.email)}</span>
          <button class="action-btn outline" id="logoutBtn" style="width:auto;padding:8px 16px;display:inline-flex;">로그아웃</button>
        </div>
      </div>

      <div class="admin-stats mono">
        <span>등록 학생 <b>${STUDENTS.length}</b>명</span>
        <span>누적 작품 <b>${PROJECTS.length}</b>개</span>
        <span>${yearRange} 기록 중</span>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="project">작품 등록</button>
        <button class="admin-tab" data-tab="list">전체 목록 · 삭제</button>
      </div>

      <div id="adminBody"></div>
    </div>`;

  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
  document.querySelectorAll('.admin-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAdminTab(btn.dataset.tab);
    });
  });
  renderAdminTab('project');
}

function renderAdminTab(tab){
  const body = document.getElementById('adminBody');
  if(tab === 'project') return renderProjectForm(body);
  if(tab === 'list') return renderAdminList(body);
}

function renderProjectForm(body){
  const studentOptions = STUDENTS.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  body.innerHTML = `
    <div class="admin-form">
      <div class="edit-row">
        <select id="f_studentId">${studentOptions || '<option disabled>등록된 학생이 없습니다</option>'}</select>
        <select id="f_type">
          <option value="program">프로젝트</option>
          <option value="presentation">발표자료</option>
          <option value="report">보고서</option>
        </select>
      </div>
      <div class="edit-row"><input type="text" id="f_title" placeholder="작품 제목"></div>
      <div class="edit-row"><input type="date" id="f_date"></div>
      <div class="edit-row"><textarea id="f_desc" rows="2" placeholder="작품 설명" style="width:100%;font-family:inherit;padding:10px;border:1px solid var(--line);border-radius:14px;"></textarea></div>
      <div class="edit-row"><textarea id="f_process" rows="3" placeholder="탐구/제작 과정" style="width:100%;font-family:inherit;padding:10px;border:1px solid var(--line);border-radius:14px;"></textarea></div>
      <div class="edit-row"><textarea id="f_learnings" rows="2" placeholder="배운 점" style="width:100%;font-family:inherit;padding:10px;border:1px solid var(--line);border-radius:14px;"></textarea></div>
      <div class="edit-row"><input type="text" id="f_tech" placeholder="사용 기술 (쉼표 구분)"></div>
      <div id="typeFields"></div>

      <button class="action-btn" id="saveProjectBtn" style="width:auto;padding:12px 22px;">작품 저장</button>
      <div class="admin-msg mono" id="projectMsg"></div>
    </div>`;

  function renderTypeFields(){
    const type = document.getElementById('f_type').value;
    const box = document.getElementById('typeFields');
    if(type === 'program'){
      box.innerHTML = `
        <div class="edit-row"><input type="text" id="f_play" placeholder="깃허브 페이지 주소 (예: https://아이디.github.io/저장소)"></div>
        <div class="edit-row"><label class="mono" style="font-size:12px;">DOCX 파일 (선택) <input type="file" id="f_docx" accept=".docx"></label></div>
        <div class="edit-row"><label class="mono" style="font-size:12px;">PDF 파일 (선택) <input type="file" id="f_pdf" accept=".pdf"></label></div>`;
    } else if(type === 'report'){
      box.innerHTML = `
        <div class="edit-row"><label class="mono" style="font-size:12px;">DOCX 파일 <input type="file" id="f_docx" accept=".docx"></label></div>
        <div class="edit-row"><label class="mono" style="font-size:12px;">PDF 파일 (선택) <input type="file" id="f_pdf" accept=".pdf"></label></div>`;
    } else if(type === 'presentation'){
      box.innerHTML = `
        <div class="edit-row"><label class="mono" style="font-size:12px;">PPTX 파일 <input type="file" id="f_pptx" accept=".pptx"></label></div>
        <div class="edit-row"><label class="mono" style="font-size:12px;">PDF 파일 (선택) <input type="file" id="f_pdf" accept=".pdf"></label></div>`;
    }
    box.innerHTML += `<div class="edit-row"><label class="mono" style="font-size:12px;">대표 이미지(썸네일) <input type="file" id="f_thumb" accept="image/*"></label></div>`;
  }
  document.getElementById('f_type').addEventListener('change', renderTypeFields);
  renderTypeFields();

  document.getElementById('saveProjectBtn').addEventListener('click', async () => {
    const msg = document.getElementById('projectMsg');
    const studentId = document.getElementById('f_studentId').value;
    const title = document.getElementById('f_title').value.trim();
    if(!studentId || !title){ msg.textContent = '학생과 제목은 필수입니다.'; return; }
    msg.textContent = '저장 중… (파일이 있으면 시간이 걸릴 수 있습니다)';
    const type = document.getElementById('f_type').value;

    async function uploadIfPresent(inputId, folder){
      const el = document.getElementById(inputId);
      if(!el || !el.files[0]) return '';
      const file = el.files[0];
      const sref = ref(storage, `${folder}/${Date.now()}_${file.name}`);
      await uploadBytes(sref, file);
      return await getDownloadURL(sref);
    }

    try{
      const data = {
        studentId, type, title,
        date: document.getElementById('f_date').value || new Date().toISOString().slice(0,10),
        description: document.getElementById('f_desc').value.trim(),
        process: document.getElementById('f_process').value.trim(),
        learnings: document.getElementById('f_learnings').value.trim(),
        techStack: document.getElementById('f_tech').value.split(',').map(s=>s.trim()).filter(Boolean),
        isPublic: true,
        createdAt: serverTimestamp(),
        thumbnailUrl: await uploadIfPresent('f_thumb', 'thumbnails')
      };

      if(type === 'program'){
        data.playUrl = document.getElementById('f_play').value.trim();
        data.docxUrl = await uploadIfPresent('f_docx', 'programs');
        data.pdfUrl = await uploadIfPresent('f_pdf', 'programs');
      } else if(type === 'report'){
        data.docxUrl = await uploadIfPresent('f_docx', 'reports');
        data.pdfUrl = await uploadIfPresent('f_pdf', 'reports');
      } else if(type === 'presentation'){
        data.pptxUrl = await uploadIfPresent('f_pptx', 'presentations');
        data.pdfUrl = await uploadIfPresent('f_pdf', 'presentations');
      }

      await addDoc(collection(db,'projects'), data);
      msg.textContent = '저장 완료.';
      await loadData();
    }catch(err){
      console.error(err);
      msg.textContent = '저장 실패: ' + err.message;
    }
  });
}

function renderAdminList(body){
  body.innerHTML = `
    <div class="admin-list-section">
      <h3 class="mono">학생 명부 (${STUDENTS.length}) · 큐비아랩 연동, 읽기 전용</h3>
      ${STUDENTS.map(s => `
        <div class="admin-list-row">
          <span>${esc(s.name)} <span class="mono" style="color:#8a8578;">· ${esc(s.grade||'')} · ${esc(s.level)}</span></span>
        </div>`).join('') || '<div class="demo-note">학생 명부를 불러오지 못했습니다.</div>'}

      <h3 class="mono" style="margin-top:26px;">작품 (${PROJECTS.length})</h3>
      ${PROJECTS.map(p => `
        <div class="admin-list-row">
          <span>${esc(p.title)} <span class="mono" style="color:#8a8578;">· ${esc(p.type)} · by ${esc((STUDENTS.find(s=>s.id===p.studentId)||{}).name||p.studentId)}</span></span>
          <button class="del-btn mono" data-col="projects" data-id="${esc(p.id)}">삭제</button>
        </div>`).join('') || '<div class="demo-note">등록된 작품이 없습니다.</div>'}
    </div>`;

  body.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('정말 삭제할까요? 되돌릴 수 없습니다.')) return;
      await deleteDoc(doc(db, btn.dataset.col, btn.dataset.id));
      await loadData();
      renderAdminList(body);
    });
  });
}

/* ================================================================
   ROUTER
   ================================================================ */
function route(){
  const h = location.hash;
  const studentProjectMatch = h.match(/^#\/student\/([^/]+)\/project\/([^/]+)$/);
  const studentMatch = h.match(/^#\/student\/([^/]+)$/);

  // 본인 편집 모드(?sid=)로 들어온 학생은 자기 페이지/자기 작품 상세 밖으로 못 나가게 막는다
  if(SELF_MODE_SID){
    const targetStudentId = studentProjectMatch ? studentProjectMatch[1] : (studentMatch ? studentMatch[1] : null);
    const allowed = h.startsWith('#/admin') === false &&
      targetStudentId !== null && decodeURIComponent(targetStudentId) === SELF_MODE_SID;
    if(!allowed){
      location.hash = `#/student/${SELF_MODE_SID}`;
      return;
    }
  }

  if(h.startsWith('#/admin')){
    renderAdmin();
  } else if(studentProjectMatch){
    renderProject(decodeURIComponent(studentProjectMatch[1]), decodeURIComponent(studentProjectMatch[2]));
  } else if(studentMatch){
    renderStudent(decodeURIComponent(studentMatch[1]));
  } else {
    renderHome();
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

(async function init(){
  await loadData();
  if(SELF_MODE_SID && !location.hash){
    const found = STUDENTS.find(s => s.id === SELF_MODE_SID);
    if(found) location.hash = `#/student/${found.id}`;
  }
  route();
})();
</script>
